<script>
(function () {
  /* 和首页共用一份偏好：主色、深浅色、正文字号 */
  var p = {};
  try { p = JSON.parse(localStorage.getItem("wszla.prefs") || "{}"); } catch (e) {}
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  var mode = p.theme === "dark" || p.theme === "light" ? p.theme : (mq.matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", mode);
  if (p.scale) document.documentElement.style.setProperty("--blog-fs", String(p.scale));
  if (p.accent) {
    var v = String(p.accent).replace("#", "");
    if (v.length === 3) v = v.split("").map(function (c) { return c + c; }).join("");
    if (/^[0-9a-f]{6}$/i.test(v)) {
      var r = parseInt(v.slice(0, 2), 16), g = parseInt(v.slice(2, 4), 16), b = parseInt(v.slice(4, 6), 16);
      var lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
      var st = document.documentElement.style;
      st.setProperty("--accent", "#" + v);
      st.setProperty("--accent-soft", "rgba(" + r + "," + g + "," + b + ",0.13)");
      st.setProperty("--accent-line", "rgba(" + r + "," + g + "," + b + ",0.38)");
      st.setProperty("--accent-ink", lum > 0.6 ? "#14130f" : "#ffffff");
    }
  }
})();
</script>
